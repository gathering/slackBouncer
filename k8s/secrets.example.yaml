---
apiVersion: v1
kind: Secret
metadata:
  name: slackbouncer-secrets
  namespace: default # change to your namespace
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:pass@postgres:5432/slackbouncer"
  SLACK_BOT_TOKEN: "xoxb-..."
  SLACK_SIGNING_SECRET: "..."
  KEYCLOAK_ISSUER: "https://keycloak.example.com/realms/your-realm"
  KEYCLOAK_CLIENT_ID: "slackbouncer"
  KEYCLOAK_CLIENT_SECRET: "..."
  KEYCLOAK_REDIRECT_URI: "https://localhost:3000/auth/callback"
  KEYCLOAK_REQUIRED_GROUP: "slackbouncer"
  KEYCLOAK_WANNABE_ISSUER: "..."
  KEYCLOAK_WANNABE_CLIENT_ID: "..."
  KEYCLOAK_WANNABE_CLIENT_SECRET: "..."
  KEYCLOAK_WANNABE_GROUP: "..."
  SESSION_SECRET: "change-this-to-a-long-random-secret"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: slackbouncer-migrate
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: your-registry/slackbouncer:latest
          command: ["pnpm", "db:deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: slackbouncer-secrets
                  key: DATABASE_URL

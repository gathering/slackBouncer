---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slackbouncer
  labels:
    app: slackbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slackbouncer
  template:
    metadata:
      labels:
        app: slackbouncer
    spec:
      containers:
        - name: slackbouncer
          image: your-registry/slackbouncer:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: slackbouncer-secrets
                  key: DATABASE_URL
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slackbouncer-secrets
                  key: SLACK_BOT_TOKEN
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: slackbouncer-secrets
                  key: SLACK_SIGNING_SECRET
            - name: KEYCLOAK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: slackbouncer-secrets
                  key: KEYCLOAK_ISSUER
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: slackbouncer-secrets
                  key: KEYCLOAK_CLIENT_ID
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: slackbouncer-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: KEYCLOAK_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: slackbouncer-secrets
                  key: KEYCLOAK_REDIRECT_URI
            - name: KEYCLOAK_REQUIRED_GROUP
              valueFrom:
                secretKeyRef:
                  name: slackbouncer-secrets
                  key: KEYCLOAK_REQUIRED_GROUP
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: slackbouncer-secrets
                  key: SESSION_SECRET
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: slackbouncer
spec:
  selector:
    app: slackbouncer
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slackbouncer
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: slackbouncer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slackbouncer
                port:
                  number: 80
  tls:
    - hosts:
        - slackbouncer.example.com
      secretName: slackbouncer-tls
